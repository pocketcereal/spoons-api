apiVersion: apps/v1
kind: Deployment
metadata:
  name: spoons-api
  namespace: spoons-api
  labels:
    app: spoons-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spoons-api
  template:
    metadata:
      labels:
        app: spoons-api
    spec:
      containers:
        - name: spoons-api
          image: ghcr.io/pocketcereal/spoons-api:latest
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - secretRef:
                name: spoons-api
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: spoons-api-config
